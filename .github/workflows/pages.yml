# Build the static site in web/ and publish it to GitHub Pages.
#
# The site is plain HTML and JavaScript; what it needs from Python (the
# fitted model, today's projection) is exported to web/data/ by
# export_static.py and is never committed -- it is rebuilt here each time.
#
# Runs on every push to main (code changes), by hand, and straight after the
# daily snapshot (see snapshot.yml): a push made with the workflow's own
# token does not start other workflows, so the daily run calls this one.
#
# One-off setup: Settings > Pages > Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      # main, not the triggering commit: when the daily run calls this, the
      # snapshot it just committed is newer than the commit that started it.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - run: pip install -r requirements.txt

      # The saved model is gitignored: refit it, as the data may have changed.
      - run: python train_and_save.py --force

      - run: python export_static.py --parity

      # The JavaScript model must agree with Python before anything ships.
      - run: node web/tests/parity.mjs

      # Draw every player, so a page-breaking error stops here, not on the site.
      - run: node web/tests/render.mjs

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r web/. _site/
          rm -rf _site/tests _site/package.json

      - uses: actions/configure-pages@v6

      # The artifact is named per attempt: "Re-run failed jobs" uploads a
      # second copy, and deploy-pages refuses to choose between two artifacts
      # with the same name (it happened on 2026-11-25).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      # Since 2026-11-24, deploy-pages has often failed with "No artifacts
      # named ... were found" when it runs straight after the upload: GitHub
      # takes a while to list a new artifact. Wait and try again. The failure
      # comes before a deployment is created, so a retry is safe.
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - if: steps.deploy1.outcome == 'failure'
        run: sleep 60

      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - if: steps.deploy2.outcome == 'failure'
        run: sleep 180

      # The last try fails the job for real if it fails too.
      - id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
