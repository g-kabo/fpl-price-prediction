# Once a day, save the official FPL API's current-season table to data/live/,
# record that day's predictions to data/history/, and commit both. The hosted
# app reads data/live/, and redeploys on the commit.
name: Daily FPL snapshot

on:
  schedule:
    # FPL prices change at about 01:30 UK time. 03:00 UTC is after that all
    # year round, with room for GitHub starting scheduled runs late.
    - cron: "0 3 * * *"
  workflow_dispatch: # the "Run workflow" button, for a manual refresh

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      # The full, pinned requirements: recording predictions refits the
      # model, which must match the one the hosted app fits.
      - run: pip install -r requirements.txt

      - run: python snapshot.py

      # A failure here must not cost the day's snapshot: commit it anyway,
      # then fail the run at the end so GitHub still sends its email.
      - name: Record today's predictions
        id: record
        continue-on-error: true
        run: python record_predictions.py

      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/live data/history
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git commit -m "Daily FPL snapshot $(date -u +%Y-%m-%d)"
          git push

      - name: Fail if the predictions were not recorded
        if: steps.record.outcome == 'failure'
        run: |
          echo "record_predictions.py failed; the snapshot was still committed."
          exit 1
